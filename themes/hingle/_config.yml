author: 'huaer-de' # 作者名称
author_avatar: 'https://sdn.geekzu.org/avatar/d22eb460ecab37fcd7205e6a3c55c228?s=200&r=X&d=' # 作者头像
author_text: '一只在努力学习的运维小白' # 作者信息（可自行修改）
social: # 社交链接
  - title: 'Github'
    icon: 'github'
    link: 'https://github.com/huaer-de'
  - title: '首页'
    icon: 'home'
    link: 'https://huaer-de.github.io'
background: 'https://api.paugram.com/wallpaper?source=gh' # 随机背景图（你喜欢的，保留）
menu: # 页眉菜单项目
  '关于我': /about
config:
  copyright: false # 复制的时候弹出保留原站链接说明
  night: true # 自动切换夜间模式

# ---------- 图片 CDN 加速（jsDelivr，可选） ----------
# 站内图片自动走 CDN，加载失败自动回退原链接；不需要可以 enable: false
img_cdn:
  enable: true
  repo: 'huaer-de/huaer-de.github.io@main' # 你的 Pages 仓库：用户名/仓库名@分支

# ---------- 小羊桌宠（右下角，可拖动，点击播放音乐） ----------
pet:
  enable: true # 关闭桌宠设为 false

# ---------- 学习背景音乐（桌宠播放，免版权） ----------
# 来源推荐：Pixabay Music https://pixabay.com/music/（复制下载直链即可外链）
music:
  enable: true
  volume: 0.5 # 默认音量 0~1
  list:
    - title: 'LoFi 学习曲'
      artist: 'Pixabay'
      url: 'https://cdn.pixabay.com/download/audio/2022/06/25/audio_4ca472b499.mp3?filename=lofi-vibes-113884.mp3'
    - title: 'Bossa Nova 轻音乐'
      artist: 'Pixabay'
      url: 'https://cdn.pixabay.com/download/audio/2021/11/18/audio_d702fb7672.mp3?filename=elevator-music-bossa-nova-background-music-version-60s-10900.mp3'
    - title: '爵士钢琴'
      artist: 'Pixabay'
      url: 'https://cdn.pixabay.com/download/audio/2023/03/22/audio_f6a5ac5e7d.mp3?filename=glass-of-wine-143532.mp3'
    - title: '咖啡厅爵士'
      artist: 'Pixabay'
      url: 'https://cdn.pixabay.com/download/audio/2022/10/25/audio_532a18db2a.mp3?filename=for-elevator-jazz-music-124005.mp3'
